name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Build, unit tests and lint
        run: ./gradlew :protocol:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: Pointa-android-development
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
